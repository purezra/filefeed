<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileFeed</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header id="fileHeader">
      <div class="bar">
        <div class="brand">
          <span class="logo">◈</span>
          <span>FileFeed</span>
        </div>
        <nav class="seg app-pages" aria-label="页面">
          <button id="showFiles" class="on" aria-pressed="true">文件看板</button>
          <button id="showSessions" aria-pressed="false">Agent 会话</button>
        </nav>
        <span class="muted small" id="status">就绪</span>
        <div class="grow"></div>
        <button class="btn ghost" id="btn-settings">设置</button>
        <button class="btn ghost" id="btn-refresh" title="重新搜索（Ctrl+R）">刷新</button>
        <button class="btn primary" id="btn-search">搜索</button>
      </div>

      <div class="filters">
        <div class="fgroup grow search-group">
          <label class="flabel" for="kw">搜索</label>
          <input id="kw" class="input" type="text" placeholder="文件名或路径（可留空）" />
        </div>

        <div class="fgroup">
          <span class="flabel">时间</span>
          <div class="frow">
            <div class="seg" id="timeMode">
              <button data-m="past" class="on">过去</button>
              <button data-m="range">区间</button>
            </div>

            <div class="past" id="pastBox">
              <input id="pastValue" class="input num" type="number" min="1" value="24" />
              <select id="pastUnit" class="input sel">
                <option value="minute">分钟</option>
                <option value="hour" selected>小时</option>
                <option value="day">天</option>
                <option value="week">周</option>
              </select>
            </div>

            <div class="range hide" id="rangeBox">
              <input id="from" class="input dt" type="datetime-local" />
              <span class="tilde">→</span>
              <input id="to" class="input dt" type="datetime-local" />
            </div>

            <select id="timeField" class="input sel">
              <option value="created" selected>按创建时间</option>
              <option value="modified">按修改时间</option>
            </select>

            <select id="sortBy" class="input sel">
              <option value="time" selected>按时间</option>
              <option value="size">按大小</option>
              <option value="name">按名称</option>
            </select>
          </div>
        </div>
      </div>

      <div class="filters">
        <div class="fgroup grow">
          <span class="flabel">类型</span>
          <div class="frow">
            <div id="typeChips" class="chips"></div>
            <button class="btn tiny ghost" id="btn-types">编辑</button>
          </div>
        </div>

        <div class="fgroup">
          <span class="flabel">快捷</span>
          <div class="frow">
            <button class="btn tiny ghost" data-group="doc">文档</button>
            <button class="btn tiny ghost" data-group="code">代码</button>
            <button class="btn tiny ghost" data-group="image">图片</button>
            <button class="btn tiny ghost" data-group="video">视频</button>
            <button class="btn tiny ghost" data-group="audio">音频</button>
            <button class="btn tiny ghost" data-group="archive">压缩包</button>
            <button class="btn tiny ghost" data-group="clear">清空</button>
          </div>
        </div>
      </div>

      <section class="preset-bar" aria-labelledby="presetBarLabel">
        <span id="presetBarLabel" class="preset-bar-label">筛选方案</span>
        <div id="presetShortcuts" class="preset-shortcuts" role="group" aria-label="已保存的筛选方案"></div>
        <button type="button" id="btn-presets" class="btn ghost preset-manage" aria-haspopup="dialog" aria-controls="modalPresets" disabled>保存当前方案</button>
      </section>

      <div id="mediaFilters" class="media-filters hide">
        <fieldset id="imageFilters" class="media-filter hide" disabled>
          <legend>图片筛选</legend>
          <div class="media-fields">
            <label class="media-field" for="imageRatio">
              <span>比例</span>
              <input id="imageRatio" class="input ratio" list="imageRatios" placeholder="不限，如 16:9" />
            </label>
            <datalist id="imageRatios">
              <option value="横图"></option><option value="竖图"></option><option value="1:1"></option>
              <option value="16:9"></option><option value="9:16"></option><option value="4:3"></option>
              <option value="3:4"></option><option value="3:2"></option><option value="2:3"></option>
            </datalist>
            <div class="media-field">
              <span>分辨率（px）</span>
              <div class="media-range">
                <select id="imageResolutionMode" class="input sel" aria-label="图片分辨率比较方式">
                  <option value="min">至少</option><option value="exact">等于</option><option value="max">至多</option>
                </select>
                <input id="imageWidth" class="input num" type="number" min="1" step="1" placeholder="宽" aria-label="图片宽度" />
                <span aria-hidden="true">×</span>
                <input id="imageHeight" class="input num" type="number" min="1" step="1" placeholder="高" aria-label="图片高度" />
              </div>
            </div>
            <div class="media-field">
              <span>大小（MB）</span>
              <div class="media-range">
                <input id="imageMinMB" class="input num" type="number" min="0" step="any" placeholder="最小" aria-label="图片最小大小（MB）" />
                <span aria-hidden="true">–</span>
                <input id="imageMaxMB" class="input num" type="number" min="0" step="any" placeholder="最大" aria-label="图片最大大小（MB）" />
              </div>
            </div>
            <button type="button" class="btn tiny ghost" data-reset-media="image">重置</button>
          </div>
        </fieldset>
        <fieldset id="videoFilters" class="media-filter hide" disabled>
          <legend>视频筛选</legend>
          <div class="media-fields">
            <div class="media-field">
              <span>大小（MB）</span>
              <div class="media-range">
                <input id="videoMinMB" class="input num" type="number" min="0" step="any" placeholder="最小" aria-label="视频最小大小（MB）" />
                <span aria-hidden="true">–</span>
                <input id="videoMaxMB" class="input num" type="number" min="0" step="any" placeholder="最大" aria-label="视频最大大小（MB）" />
              </div>
            </div>
            <div class="media-field">
              <span>时长（秒）</span>
              <div class="media-range">
                <input id="videoMinSeconds" class="input num" type="number" min="0" step="any" placeholder="最短" aria-label="视频最短时长（秒）" />
                <span aria-hidden="true">–</span>
                <input id="videoMaxSeconds" class="input num" type="number" min="0" step="any" placeholder="最长" aria-label="视频最长时长（秒）" />
              </div>
            </div>
            <button type="button" class="btn tiny ghost" data-reset-media="video">重置</button>
          </div>
        </fieldset>
      </div>
    </header>

    <nav id="formatNav" class="format-nav hide" aria-label="跳转到文件格式"></nav>
    <div id="selBar" class="selbar hide">
      <span class="selcount">已选 <b id="selCount">0</b> 个文件</span>
      <div class="selacts">
        <button class="act" data-bulk="open"><span class="action-icon" aria-hidden="true">&#xE8A7;</span>打开</button>
        <button class="act" data-bulk="reveal"><span class="action-icon" aria-hidden="true">&#xE838;</span>位置</button>
        <button class="act" data-bulk="path"><span class="action-icon" aria-hidden="true">&#xE71B;</span>路径</button>
        <button class="act" data-bulk="copy"><span class="action-icon" aria-hidden="true">&#xE8C8;</span>复制</button>
        <button class="act danger" data-bulk="delete"><span class="action-icon" aria-hidden="true">&#xE74D;</span>删除</button>
      </div>
      <div class="grow"></div>
      <button class="btn tiny ghost" id="btnClearSel">取消选择</button>
    </div>

    <main id="grid" aria-label="搜索结果" tabindex="0">
      <div id="waterfall" class="waterfall"></div>
    </main>

    <footer id="foot">
      <span id="footStat">—</span>
      <span class="grow"></span>
      <span id="footRange" class="muted"></span>
    </footer>

    <main id="sessionPage" class="hide" aria-label="Agent 会话">
      <div class="session-controls">
        <div class="session-choice">
          <label for="sessionAgent" class="muted small">Agent</label>
          <select id="sessionAgent" class="input sel"><option value="">选择 Agent</option></select>
          <div class="seg session-mode" role="group" aria-label="查找方式">
            <button id="browseSessions" class="on" aria-pressed="true">浏览会话</button>
            <button id="findSessionsByDate" aria-pressed="false">按日期查找</button>
          </div>
          <span class="grow"></span>
          <button id="openSessionArchive" class="btn ghost" title="将指定日期活跃的会话完整归档">归档工具</button>
          <button id="sessionRefresh" class="btn ghost">刷新</button>
        </div>
        <form id="sessionDateForm" class="session-date hide">
          <p id="sessionDateRule" class="small muted"></p>
          <div class="session-date-fields">
            <label class="small muted">开始日期 <input id="sessionFrom" class="input" type="date" /></label>
            <label class="small muted">结束日期 <input id="sessionTo" class="input" type="date" /></label>
            <button id="sessionToday" class="btn ghost" type="button">今天</button>
            <button id="applySessionDates" class="btn primary">查找会话</button>
          </div>
          <p class="small muted">含所选日期。只填开始或结束日期可查找单边范围。</p>
        </form>
        <div id="sessionFilters" class="session-filters hide">
          <input id="sessionSearch" class="input" type="search" aria-label="搜索会话" placeholder="搜索标题、目录、话题或会话 ID" />
          <label id="cindyClassifyLabel" class="session-clean small" title="按电脑端、Telegram Bot 和群话题树形归类">
            <input id="cindyClassify" type="checkbox" checked />按渠道分类
          </label>
          <button id="toggleAllSessions" class="btn ghost" title="折叠或展开全部分组">全部折叠</button>
        </div>
      </div>
      <div class="session-status">
        <span id="sessionCount" class="muted small" role="status"></span>
        <span id="sessionFeedback" class="small" role="status"></span>
        <button id="showSessionArchive" class="btn tiny ghost hide">查看归档位置</button>
        <span class="grow"></span>
        <div id="sessionDateActions" class="session-date-actions hide">
          <button id="mergeDatedSessions" class="btn tiny primary">合并 Markdown</button>
          <button id="zipDatedSessions" class="btn tiny ghost">导出结果为 ZIP</button>
        </div>
      </div>
      <div id="sessionLayout" class="session-layout">
        <section class="session-browser" aria-label="会话列表">
          <div id="sessionList"></div>
          <button id="moreSessions" class="btn ghost hide">加载更多</button>
        </section>
        <section id="sessionDetail" class="session-detail" aria-label="会话内容">
          <div id="sessionEmpty" class="session-empty muted">选择一条会话查看内容</div>
          <div id="sessionSelected" class="hide">
            <div class="session-detail-header">
              <div class="session-detail-actions">
                <button id="closeSessionDetail" class="btn tiny ghost">返回列表</button>
                <span id="sessionDetailAgent" class="muted small"></span>
                <div class="grow"></div>
                <button id="showSessionSource" class="btn tiny ghost">源文件位置</button>
                <label class="session-clean small" title="只显示对话正文，隐藏思考、工具调用和工具结果"><input id="cleanSessionView" type="checkbox" checked />纯净显示</label>
                <button id="exportSession" class="btn tiny">导出 Markdown</button>
              </div>
              <h2 id="sessionTitle" tabindex="-1"></h2>
              <details class="session-detail-meta">
                <summary>会话信息</summary>
                <dl id="sessionMeta"></dl>
              </details>
            </div>
            <div id="sessionReading" tabindex="0" aria-label="对话消息">
              <button id="olderSessionMessages" class="btn tiny ghost hide">加载更早消息</button>
              <div id="sessionTranscript"></div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <dialog id="sessionExportDialog" class="sheet session-dialog" aria-labelledby="sessionExportTitle">
      <form id="sessionExportForm">
        <h2 id="sessionExportTitle"></h2>
        <p id="sessionExportScope" class="small muted"></p>
        <div id="sessionExportDates">
          <div class="session-date-fields">
            <label>开始日期 <input id="sessionExportFrom" class="input" type="date" /></label>
            <label>结束日期 <input id="sessionExportTo" class="input" type="date" /></label>
            <button id="sessionExportToday" class="btn ghost" type="button">今天</button>
          </div>
          <p id="sessionExportRule" class="small muted"></p>
        </div>
        <label class="session-clean"><input id="cleanSessionExport" type="checkbox" checked />纯净导出（问答正文）</label>
        <div class="foot">
          <button id="cancelSessionExport" class="btn ghost" type="button">取消</button>
          <button class="btn primary">选择保存位置</button>
        </div>
      </form>
    </dialog>

    <dialog id="sessionArchiveDialog" class="sheet session-dialog" aria-labelledby="sessionArchiveTitle">
      <h2 id="sessionArchiveTitle">完整会话归档</h2>
      <p class="small muted">保存所选日期活跃的会话及其完整上下文。</p>
      <label for="sessionDate">归档日期</label>
      <input id="sessionDate" class="input" type="date" required />
      <form class="foot" method="dialog">
        <button class="btn ghost">关闭</button>
        <button id="copySessionCLI" class="btn ghost" type="button">复制命令</button>
        <button id="saveSessionDay" class="btn primary" type="button">保存整份会话</button>
      </form>
      <p id="sessionArchiveFeedback" class="small" role="status"></p>
    </dialog>

    <!-- 设置 -->
    <div class="modal hide" id="modalSettings">
      <div class="sheet">
        <h2>设置</h2>
        <label>监控的文件类型（逗号或换行分隔，不带点）</label>
        <textarea id="cfgExts" rows="4"></textarea>
        <label>排除路径片段（每行一个，不区分大小写）</label>
        <textarea id="cfgExclude" rows="4"></textarea>
        <div class="settings-options">
          <div>
            <label for="cfgLimit">每个类型最多显示</label>
            <input id="cfgLimit" class="input num" type="number" min="20" max="5000" />
          </div>
          <div>
            <label for="cfgRefresh">自动刷新间隔</label>
            <select id="cfgRefresh" class="input sel">
              <option value="5">5 秒</option>
              <option value="10">10 秒</option>
              <option value="15">15 秒</option>
              <option value="30">30 秒</option>
              <option value="60" selected>60 秒</option>
            </select>
          </div>
        </div>
        <fieldset class="quick-settings">
          <legend>快捷分类</legend>
          <div class="quick-setting-tools">
            <select id="cfgQuickGroup" class="input sel" aria-label="要配置的快捷分类">
              <option value="doc">文档</option><option value="code">代码</option><option value="image">图片</option>
              <option value="video">视频</option><option value="audio">音频</option><option value="archive">压缩包</option>
            </select>
            <input id="cfgQuickExt" class="input" placeholder="添加其他扩展名" aria-label="自定义扩展名" />
            <button id="cfgQuickAdd" type="button" class="btn">添加</button>
          </div>
          <div id="cfgQuickTypes" class="quick-checkboxes"></div>
        </fieldset>
        <div class="foot">
          <button class="btn ghost" data-close="modalSettings">取消</button>
          <button class="btn primary" id="btnSaveCfg">保存</button>
        </div>
      </div>
    </div>

    <dialog class="sheet preset-dialog" id="modalPresets" aria-labelledby="presetDialogTitle">
      <div class="preset-dialog-top">
        <h2 id="presetDialogTitle">管理筛选方案</h2>
        <form method="dialog"><button class="btn ghost">关闭</button></form>
      </div>
      <div id="presetList" class="preset-list"></div>
      <form id="presetForm" class="preset-add">
        <input id="presetName" class="input" aria-label="方案名称" placeholder="输入方案名称" required />
        <button type="submit" class="btn primary" id="btnAddPreset">保存当前条件</button>
      </form>
      <div id="presetFeedback" class="preset-feedback" role="status"></div>
    </dialog>

    <div id="toast"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
